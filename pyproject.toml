[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "SeisCM"
dynamic = ["version"]
description = "Seismic Colormap Generator"
readme = "README.md"
authors = [
    { name = "Lijun Zhu", email = "gatechzhu@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["seismic", "geophysics", "colormap", "matplotlib", "visualization"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/lijunzh/SeisCM"
Documentation = "https://github.com/lijunzh/SeisCM#readme"
Issues = "https://github.com/lijunzh/SeisCM/issues"
Changelog = "https://github.com/lijunzh/SeisCM/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "src/seiscm/_version.py"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["seiscm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["seiscm"]
branch = true
omit = ["*/_version.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
[[tool.mypy.overrides]]
module = "seiscm._version"
ignore_errors = true
