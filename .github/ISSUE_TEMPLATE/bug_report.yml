name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include a minimal reproducible example.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: SeisCM, Python, matplotlib and OS versions.
    validations:
      required: true
